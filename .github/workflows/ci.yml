name: CI

on:
  # A branch with a pull request is checked by its pull_request run alone, not twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Each job's name is a check that branch protection can require, so keep these names stable.
    name: npm run check (${{ matrix.os-name }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
        include:
          - os: ubuntu-latest
            os-name: Ubuntu
          - os: macos-latest
            os-name: macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Biome, tsc --noEmit, a fresh build of plugin/dist/cli.mjs, node --test, and a failure
      # if the committed bundle differs from the fresh build.
      - run: npm run check

  windows:
    # Windows gets the .cmd launcher and the tests that need neither git nor sh, with no promise
    # for v1.
    name: unit tests (Windows, Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The launcher test runs the bundle, so build it first.
      - run: npm run build
      - run: npm run test:unit

  passed:
    # One check for branch protection to require, whatever the matrix above holds.
    name: CI passed
    if: always()
    needs: [check, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done
